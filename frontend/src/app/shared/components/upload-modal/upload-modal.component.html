<h2 mat-dialog-title>Create new post</h2>

<mat-dialog-content class="upload-content">
  @if (errorMessage()) {
    <div class="error-message">
      <mat-icon>error_outline</mat-icon>
      {{ errorMessage() }}
    </div>
  }

  <!-- File Drop Zone (shown when no file selected) -->
  @if (!previewUrl) {
    <div
      class="drop-zone"
      [class.drag-over]="isDragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
      (keydown.enter)="fileInput.click()"
      (keydown.space)="fileInput.click()"
      role="button"
      tabindex="0"
      aria-label="Click or drag to upload image"
    >
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <p class="drop-text">Drag & drop your photo here</p>
      <p class="drop-subtext">or click to select from your device</p>
      <p class="drop-limit">JPG, PNG, GIF up to 5MB</p>
    </div>
  }

  <!-- Preview -->
  @if (previewUrl) {
    <div class="preview-container">
      <img [src]="previewUrl" alt="Preview" class="preview-image" />
      <button
        mat-icon-button
        class="clear-btn"
        (click)="clearFile()"
        aria-label="Remove image"
        title="Remove image"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    accept="image/*"
    class="hidden-input"
    (change)="onFileSelected($event)"
  />

  <!-- Caption -->
  <form [formGroup]="uploadForm">
    <mat-form-field class="caption-field" appearance="outline">
      <mat-label>Caption (optional)</mat-label>
      <textarea
        matInput
        formControlName="caption"
        rows="3"
        placeholder="Write a caption..."
        maxlength="2200"
      ></textarea>
      <mat-hint align="end">{{ uploadForm.value.caption?.length ?? 0 }}/2200</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isLoading()">
    Cancel
  </button>
  <button
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="!selectedFile || isLoading()"
  >
    @if (isLoading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Share
    }
  </button>
</mat-dialog-actions>
